<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer a Ride - Nexus Transit</title>
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/auth.css">
    <link rel="stylesheet" href="/static/nexus_transit.css">
</head>

<body>

    <div class="page-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.6-1.3-.9-2.1-.9H5c-.7 0-1.3.3-1.8.8L1.5 8.6C1.2 8.9 1 9.3 1 9.8V16c0 .6.4 1 1 1h2"/>
            <circle cx="7" cy="17.5" r="2.5"/>
            <circle cx="17" cy="17.5" r="2.5"/>
        </svg>
        <span>Nexus Transit</span>
    </div>

    <div class="main-card">
        <div class="card-header">
            <div class="icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9"/>
                    <circle cx="7" cy="17.5" r="2.5"/>
                    <circle cx="17" cy="17.5" r="2.5"/>
                </svg>
            </div>
            <h2>Offer a Ride</h2>
            <p>Share your journey with fellow students</p>
        </div>

        {{if .Error}}
        <div class="error-alert">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span>{{.Error}}</span>
        </div>
        {{end}}

        <div class="form-section">
            <form action="/nexus-transit/create" method="POST">

                <!-- Direction -->
                <div class="input-container">
                    <label>Direction</label>
                    <div class="direction-selector">
                        <label class="direction-option">
                            <input type="radio" name="direction" value="aller" required>
                            <div class="direction-choice">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="12 16 16 12 12 8"/>
                                    <line x1="8" y1="12" x2="16" y2="12"/>
                                </svg>
                                <span>To Campus</span>
                                <small>Driving to Zone 01</small>
                            </div>
                        </label>
                        <label class="direction-option">
                            <input type="radio" name="direction" value="retour" required>
                            <div class="direction-choice">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="12 8 8 12 12 16"/>
                                    <line x1="16" y1="12" x2="8" y2="12"/>
                                </svg>
                                <span>From Campus</span>
                                <small>Leaving Zone 01</small>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Departure Time -->
                <div class="input-container">
                    <label for="departure_time">Departure Time</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <input type="datetime-local" id="departure_time" name="departure_time" required>
                    </div>
                </div>

                <!-- Departure Location -->
                <div class="input-container">
                    <label for="departure_location">Pickup Location</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                        <input type="text" id="departure_location" name="departure_location" placeholder="e.g., Place Mohammed V" required>
                    </div>
                </div>

                <!-- Notes -->
                <div class="input-container">
                    <label for="notes">Notes (Optional)</label>
                    <textarea id="notes" name="notes" class="post-content" placeholder="Any additional information for passengers (e.g., 'I drive a blue car', 'I can make stops along the way')"></textarea>
                </div>

                <!-- Seat Limit Notice -->
                <div class="seat-notice">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="16" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                    <div>
                        <strong>Fixed Capacity: 4 Passengers</strong>
                        <p>Each ride has a strict limit of 4 passenger seats. Booking is first-come, first-served.</p>
                    </div>
                </div>

                <button type="submit" style="margin-top: 1.5rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Publish Ride
                </button>
            </form>
        </div>

        <div class="footer-text">
            Changed your mind? <a href="/nexus-transit">Back to Rides</a>
        </div>
    </div>

</body>

</html>
